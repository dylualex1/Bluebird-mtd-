<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluebird MDT</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; padding: 15px; }
        .header { background: #161b22; padding: 15px; border-radius: 8px; text-align: center; border-bottom: 3px solid #1f6feb; margin-bottom: 15px;}
        h2 { margin: 0; color: #58a6ff; font-size: 20px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 10px; background: #21262d; border: none; color: white; border-radius: 5px; font-weight: bold; cursor: pointer; text-align: center;}
        .tab.active { background: #1f6feb; }
        .panel { display: none; background: #161b22; padding: 15px; border-radius: 8px; }
        .panel.active { display: block; }
        label { display: block; margin-top: 10px; font-size: 14px; color: #8b949e; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 5px; box-sizing: border-box; }
        button.action { width: 100%; padding: 12px; margin-top: 15px; background: #238636; color: white; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }
        button.action:active { background: #2ea043; }
    </style>
</head>
<body>

    <div class="header">
        <h2>BLUEBIRD SYSTEM MDT</h2>
        <small style="color: #8b949e;">Terminal Operacyjny v1.0</small>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="zmienZakladke('mandat')">Mandat</button>
        <button class="tab" onclick="zmienZakladke('postac')">Postać</button>
        <button class="tab" onclick="zmienZakladke('legitymowanie')">Legitymacja</button>
    </div>

    <!-- PANEL MANDATU -->
    <div id="panel-mandat" class="panel active">
        <h3>Wystaw Mandat</h3>
        <label>Twój Znak / Nazwisko:</label>
        <input type="text" id="m_policjant" placeholder="np. Oficer Kowalski">
        <label>Obywatel:</label>
        <input type="text" id="m_obywatel" placeholder="Imię i Nazwisko">
        <label>Powód:</label>
        <input type="text" id="m_powod" placeholder="Opis wykroczenia">
        <label>Kwota (PLN):</label>
        <input type="number" id="m_kwota" placeholder="0">
        <button class="action" onclick="wyslijMandat()">WYSTAW MANDAT</button>
    </div>

    <!-- PANEL POSTACI -->
    <div id="panel-postac" class="panel">
        <h3>Tworzenie Postaci</h3>
        <label>Imię i Nazwisko:</label>
        <input type="text" id="p_imie" placeholder="Jan Kowalski">
        <label>Wiek:</label>
        <input type="number" id="p_wiek" placeholder="25">
        <label>Rysopis / Opis:</label>
        <textarea id="p_rysopis" rows="3" placeholder="Wzrost, znaki szczególne..."></textarea>
        <button class="action" onclick="wyslijPostac()">UTWÓRZ POSTAĆ</button>
    </div>

    <!-- PANEL LEGITYMOWANIA -->
    <div id="panel-legitymowanie" class="panel">
        <h3>Sprawdź Obywatela</h3>
        <label>Osoba legitymowana:</label>
        <input type="text" id="l_obywatel" placeholder="Imię i Nazwisko">
        <label>Notatki / Status:</label>
        <input type="text" id="l_notatki" placeholder="Brak poszukiwań / Czysty">
        <button class="action" onclick="wyslijLegitymowanie()">WYŚLIJ RAPORT</button>
    </div>

    <script>
        // TUTAJ W KODZIE WKLEJ SWOJE WEBHOOKI Z DISCORDA (w cudzysłowach)
        const WEBHOOK_MANDATY = "https://discord.com/api/webhooks/1486258468955488306/b2qIf2Ilqt3VHuszdvtOIRHmOQK6le_4TS98vnz_xOCiIKBzbHLNtlJvYyzKvB4tK7cc";
        const WEBHOOK_POSTACIE = "https://discord.com/api/webhooks/1569040236401659917/8i05NCXDJBRz_Qfk88nicMhCsMhzhLylZM30BA8lcitwUfI47Cc62gZq_MGZnuDDZUpQ";
        const WEBHOOK_LEGITYMOWANIE = "https://discord.com/api/webhooks/1486258771570200647/1ypvo2VGL9kQxBLZUS9z75WP-LeXUk2r0ea8QtLsQtnyk1Z1PTH-1k3mLc--SD7MiGFH";

        function zmienZakladke(nazwa) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('panel-' + nazwa).classList.add('active');
            event.target.classList.add('active');
        }

        function wyslijDoDiscorda(webhookUrl, tekst) {
            if (webhookUrl.includes("TUTAJ_LINK")) {
                alert('BŁĄD: Nie skonfigurowałeś jeszcze webhooków Discorda w kodzie!');
                return;
            }
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: tekst })
            }).then(() => {
                alert('Wysłano pomyślnie do systemu!');
            }).catch(err => {
                alert('Błąd wysyłania!');
                console.error(err);
            });
        }

        function wyslijMandat() {
            let p = document.getElementById('m_policjant').value;
            let o = document.getElementById('m_obywatel').value;
            let pow = document.getElementById('m_powod').value;
            let k = document.getElementById('m_kwota').value;
            let msg = `🚨 **MANDAT**\n**Funkcjonariusz:** ${p}\n**Obywatel:** ${o}\n**Powód:** ${pow}\n**Kwota:** ${k} PLN`;
            wyslijDoDiscorda(WEBHOOK_MANDATY, msg);
        }

        function wyslijPostac() {
            let i = document.getElementById('p_imie').value;
            let w = document.getElementById('p_wiek').value;
            let r = document.getElementById('p_rysopis').value;
            let msg = `👤 **NOWA POSTAĆ**\n**Imię:** ${i}\n**Wiek:** ${w}\n**Rysopis:** ${r}`;
            wyslijDoDiscorda(WEBHOOK_POSTACIE, msg);
        }

        function wyslijLegitymowanie() {
            let o = document.getElementById('l_obywatel').value;
            let n = document.getElementById('l_notatki').value;
            let msg = `🔍 **LEGITYMOWANIE**\n**Obywatel:** ${o}\n**Status:** ${n}`;
            wyslijDoDiscorda(WEBHOOK_LEGITYMOWANIE, msg);
        }
    </script>
</body>
</html>
