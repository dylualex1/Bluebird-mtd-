<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bluebird MDT</title>
    <style>
        * { box-sizing: border-box; font-family: 'Roboto', Arial, sans-serif; }
        body { margin: 0; padding: 0; background-color: #f2f2f2; color: #222; }
        
        /* EKRAN LOGOWANIA */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #161b22; color: white; z-index: 999;
            display: flex; flex-direction: column; justify-content: center; padding: 25px;
        }
        #login-screen h2 { text-align: center; color: #58a6ff; margin-bottom: 20px; font-size: 22px; }
        #login-screen label { color: #8b949e; margin-top: 15px; font-size: 14px; display: block; }
        #login-screen input { width: 100%; padding: 12px; margin-top: 5px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 5px; font-size: 16px; }
        #login-screen button { width: 100%; padding: 14px; margin-top: 25px; background: #238636; color: white; border: none; font-weight: bold; font-size: 16px; border-radius: 5px; cursor: pointer; }
        
        /* Górne paski Bluebird */
        .top-bar-1 { background-color: #4c8c2b; color: white; text-align: center; font-size: 12px; padding: 4px; font-weight: bold; }
        .top-bar-2 { background-color: #6ab03b; color: #1b3b09; font-size: 11px; padding: 4px 8px; margin-top: 2px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .status-btn {
            background-color: #76c043;
            color: #000;
            font-weight: bold;
            font-size: 14px;
            padding: 18px 12px;
            margin: 8px 6px;
            border: none;
            width: calc(100% - 12px);
            text-align: left;
            cursor: pointer;
            text-transform: uppercase;
        }
        .status-btn.busy { background-color: #e6a800; }
        .status-btn.break { background-color: #d9534f; color: white; }

        /* Siatka kafelków */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 6px;
        }
        .tile {
            border: none;
            color: white;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            padding: 10px;
            border-radius: 2px;
        }
        .tile:active { opacity: 0.85; }
        .tile-tall { height: 135px; }
        .tile-med { height: 75px; }

        .bg-light-blue { background-color: #6ea1d4; }
        .bg-blue { background-color: #3a6bc4; }
        .bg-gray { background-color: #dcdcdc; color: #555; }

        /* Dolny pasek */
        .bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 12px 6px;
            margin-top: 5px;
        }
        .btn-small {
            background-color: #3a6bc4;
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            border-radius: 2px;
        }
        .btn-info {
            position: absolute;
            right: 6px;
            padding: 10px 14px;
        }

        /* Okna (Panele po kliknięciu) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f2f2f2;
            z-index: 100;
            padding: 15px;
            overflow-y: auto;
        }
        .modal.active { display: block; }
        .modal-header {
            background: #3a6bc4;
            color: white;
            padding: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: -15px -15px 15px -15px;
        }
        .close-btn { background: #d9534f; color: white; border: none; padding: 6px 12px; font-weight: bold; cursor: pointer; }
        label { display: block; margin-top: 12px; font-size: 13px; font-weight: bold; color: #333; }
        input, select, textarea {
            width: 100%; padding: 10px; margin-top: 5px;
            border: 1px solid #bbb; background: white; font-size: 14px;
        }
        .submit-btn {
            width: 100%; padding: 14px; margin-top: 20px;
            background: #4c8c2b; color: white; border: none;
            font-weight: bold; font-size: 15px; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- EKRAN LOGOWANIA -->
    <div id="login-screen">
        <h2>BLUEBIRD MDT - LOGOWANIE</h2>
        <label>Numer służbowy:</label>
        <input type="number" id="login_nr" placeholder="np. 1304720">
        <label>PIN:</label>
        <input type="password" id="login_pin" placeholder="******">
        <button onclick="zaloguj()">ZALOGUJ DO TERMINALA</button>
        <p id="login_blad" style="color: #ff6b6b; text-align: center; font-weight: bold; display: none; margin-top: 15px;">Błędny numer lub PIN!</p>
    </div>

    <!-- EKRAN GŁÓWNY BLUEBIRD -->
    <div class="top-bar-1">Broadcaster: Połączony</div>
    <div class="top-bar-2">ZALOGUJ SIĘ DO SYSTEMU</div>
    
    <button id="statusBtn" class="status-btn" onclick="zmienStatus()">
        STATUS PATROLU WOLNY / ZMIEŃ STATUS
    </button>

    <div class="grid">
        <button class="tile tile-tall bg-light-blue" onclick="otworzOkno('legitymowanie')">LEGITYMOWANIA</button>
        <button class="tile tile-tall bg-blue" onclick="otworzOkno('mandat')">INTERWENCJA<br>WŁASNA</button>

        <button class="tile tile-med bg-blue" onclick="alert('Brak nowych komunikatów z centrali.')">KOMUNIKATY<br>NOWE: 5</button>
        <button class="tile tile-med bg-blue" onclick="otworzOkno('postac')">ZDARZENIA<br>(POSTACIE)</button>

        <button class="tile tile-med bg-gray" onclick="alert('Dostępne tylko podczas aktywnej interwencji.')">(TYLKO W<br>INTERWENCJI)<br>MELDUNKI</button>
        <button class="tile tile-med bg-gray" onclick="alert('Brak nowych dyspozycji.')">DYSPOZYCJE<br>NOWE: 3</button>

        <div></div>
        <button class="tile tile-med bg-blue" onclick="alert('Moduł mapy GPS w przygotowaniu.')">MAPA</button>
    </div>

    <div class="bottom-bar">
        <button class="btn-small" onclick="otworzOkno('postac')">OPCJE / POSTAĆ</button>
        <button class="btn-small btn-info" onclick="alert('Bluebird MDT v1.0 - System RP')">i</button>
    </div>

    <!-- PANEL: LEGITYMOWANIE -->
    <div id="modal-legitymowanie" class="modal">
        <div class="modal-header">
            <span>LEGITYMOWANIE OBYWATELA</span>
            <button class="close-btn" onclick="zamknijOkna()">X</button>
        </div>
        <label>Oficer sprawdzający:</label>
        <input type="text" id="l_policjant" readonly style="background: #e6e6e6;">
        <label>Osoba legitymowana (Imię i Nazwisko):</label>
        <input type="text" id="l_obywatel" placeholder="Jan Kowalski">
        <label>Status w bazie (Poszukiwania):</label>
        <select id="l_status">
            <option value="Czysty / Brak poszukiwań">Czysty / Brak poszukiwań</option>
            <option value="POSZUKIWANY (Uwaga! Niebezpieczny)">POSZUKIWANY (Uwaga! Niebezpieczny)</option>
            <option value="Posiada nakaz zatrzymania">Posiada nakaz zatrzymania</option>
        </select>
        <label>Notatki z kontroli:</label>
        <input type="text" id="l_notatki" placeholder="np. Kontrola drogowa, pojazd...">
        <button class="submit-btn" onclick="wyslijLegitymowanie()">WYŚLIJ RAPORT NA DISCORD</button>
    </div>

    <!-- PANEL: INTERWENCJA / MANDAT -->
    <div id="modal-mandat" class="modal">
        <div class="modal-header">
            <span>INTERWENCJA WŁASNA - MANDAT</span>
            <button class="close-btn" onclick="zamknijOkna()">X</button>
        </div>
        <label>Funkcjonariusz:</label>
        <input type="text" id="m_policjant" readonly style="background: #e6e6e6;">
        <label>Obywatel:</label>
        <input type="text" id="m_obywatel" placeholder="Imię i Nazwisko">
        <label>Powód / Wykroczenie:</label>
        <input type="text" id="m_powod" placeholder="np. Przekroczenie prędkości">
        <label>Kwota mandatu (PLN):</label>
        <input type="number" id="m_kwota" placeholder="500">
        <button class="submit-btn" onclick="wyslijMandat()">WYSTAW MANDAT NA DISCORD</button>
    </div>

    <!-- PANEL: TWORZENIE POSTACI -->
    <div id="modal-postac" class="modal">
        <div class="modal-header">
            <span>TWORZENIE POSTACI (RP)</span>
            <button class="close-btn" onclick="zamknijOkna()">X</button>
        </div>
        <label>Imię i Nazwisko Postaci:</label>
        <input type="text" id="p_imie" placeholder="np. Jan Kowalski">
        <label>Wiek:</label>
        <input type="number" id="p_wiek" placeholder="25">
        <label>Rysopis / Cechy szczególne:</label>
        <textarea id="p_rysopis" rows="3" placeholder="Wzrost, tatuaże, znaki szczególne..."></textarea>
        <button class="submit-btn" onclick="wyslijPostac()">ZAPISZ POSTAĆ NA DISCORD</button>
    </div>

    <script>
        // ==========================================
        // BAZA UŻYTKOWNIKÓW (TUTAJ DODAJESZ POLICJANTÓW)
        // ==========================================
        const UZYTKOWNICY = {
            "1304720": { pin: "123456", nazwa: "Sierż. Kowalski", jednostka: "PATROL-01" },
            "998877":  { pin: "000000", nazwa: "Post. Nowak",     jednostka: "PATROL-02" },
            "1234567": { pin: "9999", nazwa: "Oficer Zieliński", jednostka: "PATROL-03" }
        };

        // ==========================================
        // LINKI DO WEBHOOKÓW DISCORD (W CUDZYŁOWACH)
        // ==========================================
        const WEBHOOK_POSTACIE = "https://discord.com/api/webhooks/1486258771570200647/1ypvo2VGL9kQxBLZUS9z75WP-LeXUk2r0ea8QtLsQtnyk1Z1PTH-1k3mLc--SD7MiGFH";
        const WEBHOOK_LEGITYMOWANIE = "https://discord.com/api/webhooks/1486258771570200647/1ypvo2VGL9kQxBLZUS9z75WP-LeXUk2r0ea8QtLsQtnyk1Z1PTH-1k3mLc--SD7MiGFH";
        const WEBHOOK_MANDATY = "https://discord.com/api/webhooks/1486258468955488306/b2qIf2Ilqt3VHuszdvtOIRHmOQK6le_4TS98vnz_xOCiIKBzbHLNtlJvYyzKvB4tK7cc";

        function zaloguj() {
            const nr = document.getElementById('login_nr').value.trim();
            const pin = document.getElementById('login_pin').value.trim();
            const blad = document.getElementById('login_blad');

            if (UZYTKOWNICY[nr] && UZYTKOWNICY[nr].pin === pin) {
                const user = UZYTKOWNICY[nr];
                document.getElementById('login-screen').style.display = 'none';
                
                // Ustawia dane w interfejsie
                document.querySelector('.top-bar-2').innerText = `OFICER: ${user.nazwa} (${nr}) | ${user.jednostka}`;
                document.getElementById('l_policjant').value = `${user.nazwa} [${nr}]`;
                document.getElementById('m_policjant').value = `${user.nazwa} [${nr}]`;
            } else {
                blad.style.display = 'block';
            }
        }

        let statusIndex = 0;
        const statusy = [
            { text: "STATUS PATROLU WOLNY / ZMIEŃ STATUS", cls: "" },
            { text: "STATUS PATROLU INTERWENCJA / ZMIEŃ STATUS", cls: "busy" },
            { text: "STATUS PATROLU PRZERWA / ZMIEŃ STATUS", cls: "break" }
        ];

        function zmienStatus() {
            statusIndex = (statusIndex + 1) % statusy.length;
            const btn = document.getElementById('statusBtn');
            btn.innerText = statusy[statusIndex].text;
            btn.className = "status-btn " + statusy[statusIndex].cls;
        }

        function otworzOkno(nazwa) {
            zamknijOkna();
            document.getElementById('modal-' + nazwa).classList.add('active');
        }

        function zamknijOkna() {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        }

        function wyslijDoDiscorda(webhookUrl, tekst) {
            if (webhookUrl.includes("TUTAJ_LINK")) {
                alert('BŁĄD: Wklej najpierw prawdziwy link do Webhooka Discorda w kodzie!');
                return;
            }
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: tekst })
            }).then(() => {
                alert('Wysłano pomyślnie na Discord!');
                zamknijOkna();
            }).catch(err => {
                alert('Błąd wysyłania!');
                console.error(err);
            });
        }

        function wyslijLegitymowanie() {
            let p = document.getElementById('l_policjant').value;
            let o = document.getElementById('l_obywatel').value;
            let s = document.getElementById('l_status').value;
            let n = document.getElementById('l_notatki').value;
            if(!o) { alert('Wpisz obywatela!'); return; }
            let msg = `🔍 **RAPORT Z LEGITYMOWANIA**\n• **Oficer:** ${p}\n• **Sprawdzany:** ${o}\n• **Status w bazie:** **${s}**\n• **Notatki:** ${n}`;
            wyslijDoDiscorda(WEBHOOK_LEGITYMOWANIE, msg);
        }

        function wyslijMandat() {
            let p = document.getElementById('m_policjant').value;
            let o = document.getElementById('m_obywatel').value;
            let pow = document.getElementById('m_powod').value;
            let k = document.getElementById('m_kwota').value;
            if(!o) { alert('Wpisz obywatela!'); return; }
            let msg = `🚨 **WYSTAWIONO MANDAT**\n• **Funkcjonariusz:** ${p}\n• **Obywatel:** ${o}\n• **Powód:** ${pow}\n• **Kwota:** ${k} PLN`;
            wyslijDoDiscorda(WEBHOOK_MANDATY, msg);
        }

        function wyslijPostac() {
            let i = document.getElementById('p_imie').value;
            let w = document.getElementById('p_wiek').value;
            let r = document.getElementById('p_rysopis').value;
            if(!i) { alert('Wpisz imię i nazwisko!'); return; }
            let msg = `👤 **REJESTRACJA NOWEJ POSTACI**\n• **Imię i Nazwisko:** ${i}\n• **Wiek:** ${w}\n• **Rysopis:** ${r}`;
            wyslijDoDiscorda(WEBHOOK_POSTACIE, msg);
        }
    </script>
</body>
</html>
